networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  redis_data:
    driver: local

services:
  # ─── MongoDB ──────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: gp-mongodb
    restart: unless-stopped
    networks:
      - backend
    mem_limit: 1g
    cpus: "1.0"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gp-redis
    restart: unless-stopped
    networks:
      - backend
    mem_limit: 128m
    cpus: "0.3"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ─── Backend API (3 replicas) ────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    networks:
      - backend
    expose:
      - "5000"
    mem_limit: 1g
    cpus: "0.5"
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 3

  # ─── Frontend SPA (2 replicas) ──────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    networks:
      - frontend
    mem_limit: 64m
    cpus: "0.2"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      replicas: 2

  # ─── Nginx Load Balancer ─────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: gp-nginx
    restart: unless-stopped
    networks:
      - frontend
      - backend
    ports:
      - "80:80"
    mem_limit: 256m
    cpus: "0.5"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started

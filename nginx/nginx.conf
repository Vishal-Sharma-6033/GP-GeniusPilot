worker_processes  auto;
pid               /var/run/nginx.pid;

events {
    worker_connections  2048;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Basic tuning ──────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  30;
    keepalive_requests 1000;
    reset_timedout_connection on;
    client_body_timeout   30;
    client_header_timeout 30;
    client_max_body_size 10M;

    # ── Logging ──────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"'
                      ' rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main  buffer=64k;
    error_log   /var/log/nginx/error.log   warn;

    # ── Gzip ──────────────────────────────────────────────────
    gzip                on;
    gzip_vary           on;
    gzip_proxied        any;
    gzip_comp_level     5;
    gzip_min_length     256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml
        image/x-icon;

    # ── Rate limiting ─────────────────────────────────────────
    limit_req_zone  $binary_remote_addr  zone=api:10m  rate=30r/s;
    limit_req_zone  $binary_remote_addr  zone=gen:10m   rate=6r/m;
    limit_req_zone  $binary_remote_addr  zone=static:10m rate=100r/s;

    limit_conn_zone  $binary_remote_addr  zone=conn_limit:10m;
    limit_conn_status 429;

    # ── Upstream: Backend API (3 replicas, least_conn) ──────
    upstream backend {
        least_conn;
        keepalive           64;
        keepalive_requests  1000;
        keepalive_timeout   30s;

        server backend:5000 max_fails=3 fail_timeout=10s;
    }

    # ── Upstream: Frontend SPA (2 replicas, round-robin) ──
    upstream frontend {
        keepalive           32;
        keepalive_requests  500;
        keepalive_timeout   30s;

        server frontend:80 max_fails=3 fail_timeout=10s;
    }

    # ── Security headers map (apply to all responses) ────────
    map $upstream_http_content_type $x_frame_options {
        default DENY;
        ~^text/html SAMEORIGIN;
    }

    # ── Server block ─────────────────────────────────────────
    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;

        # ── Rate limiting per connection ──────────────────────
        limit_conn  conn_limit  100;

        # ── Security headers ─────────────────────────────────
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header X-XSS-Protection          "0" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

        # ── API proxy ────────────────────────────────────────
        location /api/ {
            limit_req  zone=api burst=40 nodelay;

            proxy_pass  http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host                   $host;
            proxy_set_header X-Real-IP              $remote_addr;
            proxy_set_header X-Forwarded-For        $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto      $scheme;
            proxy_set_header Connection             "";

            proxy_connect_timeout   10s;
            proxy_send_timeout      30s;
            proxy_read_timeout      90s;

            proxy_buffering         on;
            proxy_buffer_size       8k;
            proxy_buffers           8 32k;
            proxy_busy_buffers_size 64k;
            proxy_temp_file_write_size 64k;

            proxy_cookie_path   /   /;
            proxy_cookie_domain backend $host;

            proxy_next_upstream     error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        # PDF download — stream without buffering
        location /api/interview/resume/pdf/ {
            limit_req  zone=gen burst=3 nodelay;

            proxy_pass  http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host                   $host;
            proxy_set_header X-Real-IP              $remote_addr;
            proxy_set_header X-Forwarded-For        $proxy_add_x_forwarded_for;

            proxy_buffering     off;
            proxy_read_timeout  180s;
            proxy_send_timeout  60s;

            limit_rate 500k;
        }

        # ── Frontend SPA ─────────────────────────────────────
        location / {
            limit_req  zone=static burst=200 nodelay;

            proxy_pass  http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Host                   $host;
            proxy_set_header X-Real-IP              $remote_addr;
            proxy_set_header X-Forwarded-For        $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto      $scheme;

            proxy_buffering         on;
            proxy_buffer_size       4k;
            proxy_buffers           8 4k;
            proxy_busy_buffers_size 8k;

            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── Deny hidden files ────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location = /robots.txt {
            access_log off;
            log_not_found off;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }
    }
}
